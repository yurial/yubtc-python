name: tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read
  # `actions/upload-code-coverage@v1` needs to publish the report to
  # GitHub's coverage graph (visible in PRs and Insights > Code coverage).
  code-quality: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # YuBTC itself is not installed: pytest picks it up from src/ via the
      # pythonpath setting in pyproject.toml, matching how it runs locally.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pytest>=7.0' pytest-cov

      # Coverage settings, including the fail_under gate, live in pyproject.toml.
      # The xml report is consumed by actions/upload-code-coverage below.
      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=html --cov-report=xml:coverage.xml

      - name: Publish coverage summary
        if: always() && matrix.python-version == '3.12'
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      # Push the Cobertura XML to GitHub's native coverage graph.
      # One upload per CI is enough; pin it to the latest Python so the
      # label is stable across the matrix. `fail-on-error: false` keeps
      # the green/red status tied to the tests, not the network.
      - name: Upload coverage to GitHub
        if: matrix.python-version == '3.12'
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage
          fail-on-error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # flake8 isn't a runtime/test dependency; install it directly.
      # The --max-line-length must match what's used locally (120).
      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: python -m flake8 src/yubtc tests --max-line-length=120
