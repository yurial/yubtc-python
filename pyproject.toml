[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yubtc"
version = "0.1.0"
description = "Console BTC client that stores nothing on disk; private keys are derived from a seed."
readme = "README"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yuri Dyachenko", email = "pub.yurial@gmail.com" }]
dependencies = [
    "requests",
    "click",
    "ecdsa",
    "base58",
    "safe-pysha3",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
yubtc = "yubtc.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["yubtc"]
branch = true

[tool.coverage.report]
show_missing = true
# Branch coverage is currently 9.5% (100 of 1053 points: 93 statements + 7
# branches). This is a ratchet against regressions, not a target -- raise it as
# tests land. Note the figure is lower than statement-only coverage (11%)
# because the 182 branches inside untested modules count against the total.
fail_under = 9
