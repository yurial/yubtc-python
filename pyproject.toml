[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yubtc"
version = "0.1.0"
description = "Console BTC client that stores nothing on disk; private keys are derived from a seed."
readme = "README"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yuri Dyachenko", email = "pub.yurial@gmail.com" }]
dependencies = [
    "requests",
    "click",
    "coincurve",
    "base58",
    "pycryptodome",
    "argon2-cffi",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
yubtc = "yubtc.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
# Pin the source to the package only. The CWD-relative "yubtc"
# pick-up also matches the launcher script at the repo root (no .py
# suffix), which produces a duplicate <source> entry in coverage.xml.
source = ["src/yubtc"]
branch = true

[tool.coverage.report]
show_missing = true
# Project target is 100% line + branch coverage. Every module must be fully
# exercised; if you add code, add tests with it.
fail_under = 100
